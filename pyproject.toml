[project]
name = "primr"
version = "0.2.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.38.2",
    "imageio-ffmpeg>=0.8.1",
    "mss>=10.2.0",
    "pillow>=13.0.0",
    "pyside6-essentials>=6.12.0",
    "selenium>=4.53.0",
    "websocket-client>=1.9.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
